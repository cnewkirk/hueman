[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hueman"
version = "0.1.0"
description = "Declarative, Terraform-style management of Philips Hue lighting policies with circadian, motion and timing optimisation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.28",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.11",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
hueman = "hueman.cli:main"
hue-iac = "hueman.cli:main"   # transitional alias, remove after one release

[tool.setuptools.packages.find]
include = ["hueman*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
files = ["hueman"]
strict = true
