name: Claude Code

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: Task for Claude to perform
        required: true
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  claude:
    # Run on manual dispatch, or when a repo owner/member/collaborator's
    # issue/PR comment mentions @claude. The author gate matters on a public
    # repo: without it, any passer-by comment could drive Claude (and spend
    # the API key) with write permissions on this repo.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude Code Base Action
        uses: anthropics/claude-code-base-action@beta
        with:
          prompt: ${{ github.event.inputs.prompt || github.event.comment.body }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: "Bash,Edit,Read,Write,Glob,Grep"
          timeout_minutes: "20"
